<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Gravity</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --hover: #f0f2f6;
  --border: #e2e6ed;
  --border-strong: #cdd4df;
  --text: #0f1729;
  --text-2: #465266;
  --muted: #677185;
  --accent: #6a47f5;
  --accent-2: #0ea5c6;
  --accent-soft: rgba(106, 71, 245, .10);
  --accent-ink: #ffffff;
  --good: #0ca30c;
  --good-text: #067306;
  --warning: #fab219;
  --warning-text: #8a5a00;
  --critical: #d03b3b;
  --critical-text: #b42323;
  --grid: #edf0f4;
  --axis: #cdd4df;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --code-bg: #f3f4f8;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 8px rgba(16, 24, 40, .05);
  --shadow-lg: 0 20px 50px rgba(15, 23, 41, .22);
  --radius: 12px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0d13;
    --surface: #121722;
    --surface-2: #0f141d;
    --hover: #1a2130;
    --border: #232b3a;
    --border-strong: #313b4e;
    --text: #e8ecf3;
    --text-2: #aab3c2;
    --muted: #818b9d;
    --accent: #8f73ff;
    --accent-2: #22c3e6;
    --accent-soft: rgba(143, 115, 255, .15);
    --good-text: #3bc93b;
    --warning-text: #f5bd3e;
    --critical-text: #ff7a7a;
    --grid: #1c2331;
    --axis: #313b4e;
    --series-1: #3987e5;
    --series-2: #d95926;
    --code-bg: #0c1018;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0d13;
  --surface: #121722;
  --surface-2: #0f141d;
  --hover: #1a2130;
  --border: #232b3a;
  --border-strong: #313b4e;
  --text: #e8ecf3;
  --text-2: #aab3c2;
  --muted: #818b9d;
  --accent: #8f73ff;
  --accent-2: #22c3e6;
  --accent-soft: rgba(143, 115, 255, .15);
  --good-text: #3bc93b;
  --warning-text: #f5bd3e;
  --critical-text: #ff7a7a;
  --grid: #1c2331;
  --axis: #313b4e;
  --series-1: #3987e5;
  --series-2: #d95926;
  --code-bg: #0c1018;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, .55);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* layout */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px; border-right: 1px solid var(--border); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand img { width: 32px; height: 32px; border-radius: 9px; }
.brand b { font-size: 15px; letter-spacing: -.2px; display: block; }
.brand small { color: var(--muted); font-size: 11.5px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--text-2); font-weight: 500; }
.nav a:hover { background: var(--hover); color: var(--text); text-decoration: none; }
.nav a.active { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; padding: 0 7px; }
.side-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(12, 163, 12, .18); }
.live.off::before { background: var(--muted); box-shadow: none; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.top h1 { font-size: 18px; margin: 0; letter-spacing: -.3px; }
.top .grow { flex: 1; }
.page { padding: 24px 28px 60px; max-width: 1320px; width: 100%; }
.btn.menu-btn { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; z-index: 30; left: 0; top: 0; width: 250px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow-lg); }
  .side.open { transform: none; }
  .btn.menu-btn { display: inline-flex; }
  .top { padding: 12px 16px; }
  .page { padding: 16px 16px 60px; }
  .endpoint-chip { display: none !important; }
}

/* primitives */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-h h2, .card-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.card-h .sub { color: var(--muted); font-size: 12.5px; }
.card-b { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1100px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .g2, .g3 { grid-template-columns: 1fr; } }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.spacer { flex: 1; }
.stack { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-content: start; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.strong { font-weight: 600; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mt { margin-top: 16px; }
.mb { margin-bottom: 16px; }
.hidden { display: none !important; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--critical-text); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; border-radius: 7px; }
.btn.icon { width: 34px; padding: 0; }
.btn.sm.icon { width: 28px; }

.input, select.input, textarea.input { width: 100%; height: 36px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); outline: none; }
textarea.input { height: auto; min-height: 80px; padding: 9px 11px; resize: vertical; line-height: 1.45; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input.mono { font-family: var(--mono); font-size: 12.5px; }
label.field { display: grid; gap: 6px; }
label.field > span { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
label.field > small { color: var(--muted); font-size: 12px; }
.form { display: grid; gap: 14px; }
.form-2 { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
@media (max-width: 640px) { .form-2 { grid-template-columns: 1fr; } }

.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track { width: 34px; height: 20px; border-radius: 99px; background: var(--border-strong); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(14px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.good { color: var(--good-text); }
.badge.warn { color: var(--warning-text); }
.badge.bad { color: var(--critical-text); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); }
.dot.good { background: var(--good); }
.dot.warn { background: var(--warning); }
.dot.bad { background: var(--critical); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px 0 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-2); font-family: var(--mono); font-size: 12px; max-width: 100%; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 3px; border-radius: 4px; display: inline-flex; }
.chip button:hover { color: var(--critical-text); background: var(--hover); }
.kbd { font-family: var(--mono); font-size: 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
.avatar { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; font-size: 15px; }
.avatar.sm { width: 28px; height: 28px; border-radius: 8px; font-size: 12.5px; }

pre.code { position: relative; margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--code-bg); border: 1px solid var(--border); overflow: auto; white-space: pre; line-height: 1.5; max-height: 360px; }
.code-wrap { position: relative; }
.code-wrap .copy-btn { position: absolute; top: 8px; right: 8px; }
.copyline { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); min-width: 0; }
.copyline code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--surface-2); position: sticky; top: 0; }
table.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl tr.click { cursor: pointer; }
table.tbl tr.click:hover td { background: var(--hover); }
table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow: auto; }

.empty { display: grid; place-items: center; text-align: center; gap: 8px; padding: 40px 20px; color: var(--muted); }
.empty h3 { margin: 0; color: var(--text); font-size: 15px; }

.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 9px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 11px; border-radius: 7px; cursor: pointer; color: var(--text-2); font-weight: 500; font-size: 13px; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { padding: 14px 16px; }
.tile .lbl { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.tile .val { font-size: 24px; font-weight: 650; letter-spacing: -.5px; margin-top: 2px; }
.tile .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg.plot { display: block; width: 100%; overflow: visible; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .col { transition: opacity .12s; }
.chart.hovering .col { opacity: .45; }
.chart.hovering .col.on { opacity: 1; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:focus { outline: none; }
.chart-empty { position: absolute; inset: 0 0 24px 44px; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; }
.legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: -1px; }
.tip { position: fixed; z-index: 100; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 9px 11px; font-size: 12.5px; min-width: 150px; opacity: 0; transition: opacity .08s; }
.tip.on { opacity: 1; }
.tip .t { color: var(--muted); font-size: 11.5px; margin-bottom: 5px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .k { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tip .v { font-weight: 650; font-variant-numeric: tabular-nums; }
.tip .n { color: var(--text-2); }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; gap: 4px; }
.bar-row .top-line { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
.bar-row .top-line .ellipsis { flex: 1; }
.bar-track { height: 8px; }
.bar-fill { height: 8px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
.bar-row:hover .bar-fill { filter: brightness(1.15); }

/* providers */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.pcard { padding: 16px; display: grid; gap: 12px; }
.pcard.off { opacity: .6; }
.pcard .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.keyrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px; }
.cat-item { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.cat-item:hover { border-color: var(--accent); background: var(--accent-soft); }
.cat-item b { display: block; font-size: 13.5px; }
.cat-item .desc { color: var(--muted); font-size: 12px; line-height: 1.35; display: block; margin-top: 2px; }
.section-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 8px; }

/* combos */
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chain .arrow { color: var(--muted); }

/* playground */
.pg { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .pg { grid-template-columns: 1fr; } }
.chat { display: flex; flex-direction: column; height: calc(100vh - 170px); min-height: 460px; }
.msgs { flex: 1; overflow: auto; padding: 18px; display: grid; gap: 14px; align-content: start; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.55; }
.msg.user { justify-self: end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.assistant { justify-self: start; background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.error { background: transparent; border: 1px solid var(--critical); color: var(--critical-text); }
.msg .think { color: var(--muted); font-size: 12.5px; border-left: 2px solid var(--border-strong); padding-left: 10px; margin-bottom: 8px; white-space: pre-wrap; }
.msg .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.composer { display: flex; gap: 10px; padding: 12px; border-top: 1px solid var(--border); }
.composer textarea { min-height: 44px; max-height: 200px; }

/* logs */
.loglines { font-family: var(--mono); font-size: 12px; max-height: 320px; overflow: auto; padding: 10px 14px; line-height: 1.6; }
.loglines .l-warn { color: var(--warning-text); }
.loglines .l-error { color: var(--critical-text); }
.loglines .l-success { color: var(--good-text); }
.loglines time { color: var(--muted); margin-right: 8px; }

/* modal & toast */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 11, 18, .55); display: grid; place-items: center; padding: 20px; animation: fade .12s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); }
.modal.wide { width: min(880px, 100%); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-h h2 { margin: 0; font-size: 16px; flex: 1; }
.modal-b { padding: 18px 20px; overflow: auto; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
.toasts { position: fixed; bottom: 18px; right: 18px; z-index: 120; display: grid; gap: 8px; }
.toast { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 10px 14px; max-width: 380px; font-size: 13px; animation: fade .15s; }
.toast.error { border-left-color: var(--critical); }
.toast.success { border-left-color: var(--good); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: -4px 0 16px; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.login .card { width: min(380px, 100%); padding: 28px; display: grid; gap: 16px; text-align: center; }
.hero-empty { padding: 26px; display: grid; gap: 16px; }
.hero-empty h2 { margin: 0; font-size: 20px; letter-spacing: -.3px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }
.step { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--surface-2); }
.step b { display: flex; align-items: center; gap: 8px; }
.step .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font-size: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="modals"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
'use strict';
// ---------------------------------------------------------------- helpers
const $ = (sel, root = document) => root.querySelector(sel);

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value') el.value = v;

async function api(method, path, body) {
  const headers = { 'x-og-admin': '1' };
  if (body !== undefined) headers['content-type'] = 'application/json';
  const res = await fetch('/admin/api' + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (res.status === 401 && !path.startsWith('/login')) {
    showLogin();
    throw new Error('Login required');
  }
  if (!res.ok) throw new Error((data && data.error && data.error.message) || res.statusText || 'Request failed');
  return data;
}

}

  } catch (e) {

}

function connectEvents() {
  if (S.events) S.events.close();
  const es = new EventSource('/admin/api/events');
  S.events = es;
  const setLive = (v) => {
    S.live = v;
    const el = $('#live-ind');
    if (el) { el.className = 'live' + (v ? '' : ' off'); el.textContent = v ? 'Router online' : 'Reconnecting…'; }
  };
  es.onopen = () => setLive(true);
  es.onerror = () => setLive(false);
  es.addEventListener('request', (e) => { const r = JSON.parse(e.data); S.onRecord && S.onRecord(r); });
  es.addEventListener('log', (e) => { const l = JSON.parse(e.data); S.onLog && S.onLog(l); });
}

function keyStatus(k) {
  const hlt = k.health || {};
  const now = Date.now();
  const modelCd = Object.values(hlt.modelCooldowns || {}).filter((t) => t > now);
  if (!k.enabled) return { kind: '', label: 'Disabled' };
  if (hlt.cooldownUntil && hlt.cooldownUntil > now) return { kind: 'bad', label: 'Paused ' + fmt.until(hlt.cooldownUntil), detail: hlt.reason };
  if (modelCd.length) return { kind: 'warn', label: `Rate-limited (${modelCd.length} model${modelCd.length > 1 ? 's' : ''})`, detail: hlt.lastError };
  if (hlt.lastStatus && hlt.lastStatus >= 400 && (!hlt.lastOkAt || hlt.lastErrorAt > hlt.lastOkAt)) return { kind: 'bad', label: 'Error ' + hlt.lastStatus, detail: hlt.lastError };
  if (hlt.lastOkAt) return { kind: 'good', label: 'Healthy' };
  return { kind: '', label: 'Not used yet' };
}
function statusBadge(st) {
  const glyph = st.kind === 'good' ? '✓ ' : st.kind === 'bad' ? '✕ ' : st.kind === 'warn' ? '! ' : '';
  return h('span', { class: 'badge ' + st.kind, title: st.detail || '' }, h('span', { class: 'dot ' + st.kind }), glyph + st.label);
}
function providerStatus(p) {
  if (!p.enabled) return { kind: '', label: 'Disabled' };
  if (!p.keys.length) return p.keyOptional ? { kind: '', label: 'No key needed' } : { kind: 'bad', label: 'No API key' };
  const sts = p.keys.map(keyStatus);
  if (sts.some((x) => x.kind === 'good')) return sts.some((x) => x.kind === 'bad' || x.kind === 'warn') ? { kind: 'warn', label: 'Degraded' } : { kind: 'good', label: 'Healthy' };
  if (sts.every((x) => x.kind === 'bad')) return { kind: 'bad', label: 'Failing' };
  if (sts.some((x) => x.kind === 'warn')) return { kind: 'warn', label: 'Rate-limited' };
  return { kind: '', label: 'Ready' };
}

async function testProvider(p, btn, model, keyId) {

  try {
    const r = await api('POST', '/providers/' + encodeURIComponent(p.id) + '/test', { model, keyId });
    if (r.ok) toast(`${p.id}/${r.model} answered in ${fmt.ms(r.latencyMs)}${r.text ? ` — “${r.text.slice(0, 60)}”` : ''}`, 'success', 5000);
    else toast(`${p.id}/${r.model || '?'} failed${r.status ? ` (HTTP ${r.status})` : ''}: ${r.error || 'unknown error'}`, 'error', 9000);
    return r;
  } catch (e) {

    if (btn) { btn.disabled = false; btn.lastChild.textContent = label; }

/** Capabilities of a model from the model database (+ learned fixes): [context, maxOutput, tools 1/0/-1, vision, reasoning]. */
function modelCaps(p, m) {
  const c = (p.caps || {})[m];
  const fix = (S.state.compat || {})[p.id + '::' + m];
  const emulated = p.toolMode === 'emulate' || (fix && fix.emulateTools) || (c && c[2] === 0 && p.toolMode !== 'native');
  return { c, emulated };
}
function fmtCtx(n) {
  return n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(n);
}
function capsTag(p, m) {
  const { c, emulated } = modelCaps(p, m);
  const bits = [];
  if (c && c[0]) bits.push(fmtCtx(c[0]));
  if (emulated) bits.push('emulated tools');
  if (c && c[3]) bits.push('vision');
  if (c && c[4]) bits.push('reasoning');
  return bits.length ? h('span', { class: 'muted tiny', style: { marginLeft: '2px' } }, bits.join(' · ')) : null;
}
function capsTitle(p, m) {
  const { c, emulated } = modelCaps(p, m);
  const lines = [];
  if (c) {
    if (c[0]) lines.push(`Context: ${fmt.n(c[0])} tokens`);
    if (c[1]) lines.push(`Max output: ${fmt.n(c[1])} tokens`);
    if (c[3]) lines.push('Vision input');
    if (c[4]) lines.push('Reasoning');
  }
  lines.push(emulated ? 'Tool calling: emulated by Open Gravity' : c && c[2] === 1 ? 'Tool calling: native' : 'Tool calling: native, emulated automatically if refused');
  return '\n' + lines.join('\n');
}

function targetChip(t) {

  const msgs = h('div', { class: 'msgs', 'aria-live': 'polite' });
  const input = h('textarea', { class: 'input', rows: 1, placeholder: 'Send a message…  (Enter to send, Shift+Enter for a new line)' });
  const sendBtn = h('button', { class: 'btn primary', 'aria-label': 'Send' }, icon('send'), 'Send');
  const chat = h('div', { class: 'card chat' }, msgs, h('div', { class: 'composer' }, input, sendBtn));
  page.append(h('div', { class: 'pg' }, settings, chat));

  function msgEl(m) {
    const el = h('div', { class: 'msg ' + m.role + (m.error ? ' error' : '') });
    if (m.reasoning) el.append(h('div', { class: 'think' }, m.reasoning));
    el.append(h('div', null, m.content || (m.pending ? '…' : '')));
    if (m.meta) el.append(h('div', { class: 'meta' }, m.meta));
    return el;
  }
  function drawMsgs() {
    msgs.replaceChildren(...(PG.messages.length ? PG.messages.map(msgEl) : [emptyState('Try any model', 'Messages go through the router exactly like your tools\' requests, including fallback.')]));
    msgs.scrollTop = msgs.scrollHeight;
  }
  drawMsgs();

  async function send() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    PG.messages.push({ role: 'user', content: text });
    const reply = { role: 'assistant', content: '', reasoning: '', pending: true };
    PG.messages.push(reply);
    drawMsgs();
    sendBtn.disabled = true;
    const t0 = performance.now();
    let ttft = 0;
    const history = PG.messages.filter((m) => !m.error && !m.pending && m !== reply).map((m) => ({ role: m.role, content: m.content }));
    const body = { model: (PG.model || modelIn.value).trim(), stream: PG.stream, stream_options: { include_usage: true }, messages: [...(PG.system ? [{ role: 'system', content: PG.system }] : []), ...history] };
    if (PG.temperature !== '') body.temperature = Number(PG.temperature);
    if (PG.maxTokens !== '') body.max_tokens = Number(PG.maxTokens);
    if (PG.effort) body.reasoning_effort = PG.effort;
    try {
      const res = await fetch('/admin/api/playground', { method: 'POST', headers: { 'x-og-admin': '1', 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const route = res.headers.get('x-og-provider') ? `${res.headers.get('x-og-provider')}/${res.headers.get('x-og-model')}` : '';
      let usage = null;
      if (!res.ok || !PG.stream) {
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || res.statusText);
        const m = data.choices?.[0]?.message || {};
        reply.content = m.content || (m.tool_calls ? JSON.stringify(m.tool_calls, null, 2) : '');
        reply.reasoning = m.reasoning_content || '';
        usage = data.usage;
      } else {
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const block = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            for (const line of block.split('\n')) {
              if (!line.startsWith('data:')) continue;
              const d = line.slice(5).trim();
              if (d === '[DONE]') continue;
              let j;
              try { j = JSON.parse(d); } catch { continue; }
              if (j.error) throw new Error(j.error.message);
              const delta = j.choices?.[0]?.delta || {};
              if (delta.content || delta.reasoning_content) { if (!ttft) ttft = performance.now() - t0; }
              if (delta.content) reply.content += delta.content;
              if (delta.reasoning_content) reply.reasoning += delta.reasoning_content;
              if (delta.tool_calls) reply.content += delta.tool_calls.map((t) => t.function?.name ? `\n[tool call ${t.function.name}] ` : t.function?.arguments || '').join('');
              if (j.usage) usage = j.usage;
            }
          }
          const last = msgs.lastChild;
          if (last) last.replaceWith(msgEl(reply));
          msgs.scrollTop = msgs.scrollHeight;
        }
      }
      reply.pending = false;
      const total = performance.now() - t0;
      reply.meta = [route, fmt.ms(total), ttft ? `first token ${fmt.ms(ttft)}` : '', usage ? `${usage.prompt_tokens}→${usage.completion_tokens} tokens` : ''].filter(Boolean).join(' · ');
    } catch (e) {
      reply.pending = false;
      reply.error = true;
      reply.content = e.message;
    } finally {
      sendBtn.disabled = false;
      drawMsgs();
      input.focus();
    }
  }
  sendBtn.onclick = send;
  input.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
};

    h('div', { class: 'row' },
      h('button', { class: 'btn primary', onclick: async () => { await run(() => api('POST', '/password', { password: pw.value }), 'Password saved'); refresh(); } }, cfg.passwordSet ? 'Change password' : 'Set password'),
      cfg.passwordSet ? h('button', { class: 'btn danger', onclick: async () => { if (await confirmDialog('Remove the dashboard password?', 'Remove')) { await run(() => api('POST', '/password', { password: '' }), 'Password removed'); refresh(); } } }, 'Remove password') : null),
  ]);

  const fileIn = h('input', { type: 'file', accept: 'application/json,.json', class: 'hidden' });
  fileIn.onchange = async () => {
    const f = fileIn.files[0];
    if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch { toast('Not a valid JSON file', 'error'); return; }
    if (!(await confirmDialog('Replace the current configuration (providers, keys, combos, settings) with this file?', 'Import'))) return;
    await run(() => api('POST', '/config/import', data), 'Configuration imported');
    refresh();
  };
  const backup = section('Backup', null, [
    h('div', { class: 'muted small' }, 'The export contains your provider API keys: store it safely.'),
    h('div', { class: 'row' },
      h('button', {
        class: 'btn', onclick: async () => {
          const res = await fetch('/admin/api/config/export');
          const blob = await res.blob();
          const a = h('a', { href: URL.createObjectURL(blob), download: 'open-gravity-config.json' });
          document.body.append(a);
          a.click();
          a.remove();
        },
      }, icon('download'), 'Export configuration'),
      h('button', { class: 'btn', onclick: () => fileIn.click() }, icon('upload'), 'Import configuration'), fileIn),
  ]);

  const about = section('About', null, [h('table', { class: 'tbl' }, h('tbody', null,
    [['Version', 'v' + st.version], ['Listening on', `${st.listening.host}:${st.listening.port}`], ['Data folder', st.dataDir], ['Platform', st.platform], ['Running since', fmt.datetime(st.startedAt)]]
      .map(([k, v]) => h('tr', null, h('td', { class: 'muted', style: { width: '160px' } }, k), h('td', { class: 'mono' }, v))))),
  h('div', { class: 'muted small' }, 'Open Gravity is MIT-licensed. ', h('a', { href: 'https://github.com/limoonsdev/Open-Gravity', target: '_blank', rel: 'noopener noreferrer' }, 'GitHub ↗'))]);

  const adaptive = h('input', { type: 'checkbox', checked: cfg.adaptiveCompat });
  const cacheTtl = num(cfg.cacheTtlSeconds || 0, { min: 0 });
  const mdbAuto = h('input', { type: 'checkbox', checked: cfg.modelDbAutoUpdate });
  const mdbInfo = h('span', { class: 'muted small' }, `${fmt.n(st.modelDb.models)} models from ${st.modelDb.providers} provider families · updated ${st.modelDb.updated || 'never'}`);
  const mdbBtn = h('button', {
    class: 'btn', onclick: async () => {
      mdbBtn.disabled = true;
      try {
        const r = await run(() => api('POST', '/modeldb/update', {}), 'Model database updated');
        mdbInfo.textContent = `${fmt.n(r.models)} models from ${r.providers} provider families · updated ${r.updated}`;
      } finally { mdbBtn.disabled = false; }
    },
  }, icon('refresh'), 'Update now');
  const compatSec = section('Compatibility & performance', null, [
    h('label', { class: 'switch' }, adaptive, h('span', { class: 'track' }), h('span', null, 'Self-healing: when a provider rejects a request (unsupported tools, parameter, system role, images, output limit…), fix it, retry and remember the fix')),
    field('Response cache (seconds, 0 = off)', cacheTtl, `Identical requests are answered from memory. ${st.cacheSize} cached.`),
    h('div', { class: 'stack', style: { gap: '6px' } }, h('span', { class: 'small strong' }, 'Model database (context windows, tool support, prices)'), mdbInfo,
      h('div', { class: 'row' }, mdbBtn, h('label', { class: 'switch' }, mdbAuto, h('span', { class: 'track' }), h('span', { class: 'small' }, 'Update weekly')))),
    h('div', { class: 'stack', style: { gap: '6px' } }, h('span', { class: 'small strong' }, 'Learned fixes'), compatPanel(null)),
  ], async () => {
    await run(() => api('PUT', '/settings', { adaptiveCompat: adaptive.checked, cacheTtlSeconds: Number(cacheTtl.value) || 0, modelDbAutoUpdate: mdbAuto.checked }), 'Saved');
    refresh();
  });

  page.append(h('div', { class: 'grid g2' }, h('div', { class: 'stack' }, server, compatSec, network), h('div', { class: 'stack' }, routing, security, logging, backup, about)));
};

// ---------------------------------------------------------------- boot
function showLogin(reason) {
  const pw = h('input', { class: 'input', type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
  const err = h('div', { class: 'small', style: { color: 'var(--critical-text)', minHeight: '18px' } });
  const submit = async (e) => {
    e && e.preventDefault();
    try {
      await api('POST', '/login', { password: pw.value });
      location.reload();
    } catch (ex) { err.textContent = ex.message; }
  };
  $('#root').replaceChildren(h('div', { class: 'login' }, h('form', { class: 'card', onsubmit: submit },
    h('img', { src: '/logo.svg', alt: '', style: { width: '48px', height: '48px', margin: '0 auto', borderRadius: '12px' } }),
    h('div', null, h('h2', { style: { margin: '0 0 4px' } }, 'Open Gravity'), h('div', { class: 'muted' }, reason || 'Enter the dashboard password')),
    reason ? null : [pw, err, h('button', { class: 'btn primary', type: 'submit' }, 'Unlock')])));
  if (!reason) pw.focus();
}

(async function boot() {
  try {
    const t = localStorage.getItem('og-theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch { /* storage unavailable */ }
  try {
    const sess = await api('GET', '/session');
    if (!sess.authenticated) return showLogin(sess.needsLogin ? null : sess.reason);
    await loadState();
  } catch (e) {
    if (!/Login required/.test(e.message)) $('#root').replaceChildren(h('div', { class: 'login' }, h('div', { class: 'card' }, h('h2', null, 'Cannot reach Open Gravity'), h('div', { class: 'muted' }, e.message))));
    return;
  }
  window.addEventListener('hashchange', () => { $('#modals').replaceChildren(); render(); });
  await render();
  connectEvents();
  // keep provider health / cooldown timers fresh
  setInterval(async () => {
    if (document.hidden || !['providers', 'combos'].includes(S.route) || $('#modals').childElementCount) return;
    try { await refresh(); } catch { /* ignore */ }
  }, 15000);
})();
</script>
</body>
