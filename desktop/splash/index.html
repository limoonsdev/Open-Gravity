<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Gravity</title>
<style>
  :root { color-scheme: dark; --bg: #0a0b16; --fg: #eceaff; --muted: #9a97c0; --accent: #8b5cf6; --line: rgba(255,255,255,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 700px at 50% 38%, #1c1547 0%, #0e0d24 45%, var(--bg) 100%); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; user-select: none; }
  .titlebar { position: fixed; inset: 0 0 auto 0; height: 40px; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 6px; z-index: 5; }
  .titlebar .drag { position: absolute; inset: 0; }
  .titlebar button { position: relative; width: 44px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: default; display: grid; place-items: center; }
  .titlebar button:hover { background: rgba(255,255,255,.08); color: var(--fg); }
  .titlebar button.close:hover { background: #e11d48; color: #fff; }
  .titlebar.hidden { display: none; }
  main { height: 100%; display: grid; place-items: center; padding: 24px; }
  .center { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 560px; width: 100%; }
  .logo { width: 132px; height: 132px; filter: drop-shadow(0 18px 50px rgba(139,92,246,.45)); animation: float 5s ease-in-out infinite; }
  .logo svg { width: 100%; height: 100%; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 26px 0 4px; font-weight: 700; }
  .tag { color: var(--muted); margin: 0; }
  .status { margin-top: 30px; color: var(--muted); min-height: 22px; font-size: 13px; }
  .bar { margin-top: 12px; width: 220px; height: 4px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 99px; background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(260%) } }
  .error { display: none; margin-top: 28px; width: 100%; text-align: left; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .error h2 { margin: 0 0 6px; font-size: 15px; color: #fda4af; }
  .error p { margin: 0; white-space: pre-wrap; color: var(--fg); font-size: 13px; }
  .error pre { display: none; margin: 12px 0 0; max-height: 200px; overflow: auto; background: rgba(0,0,0,.35); border-radius: 12px; padding: 10px 12px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #c7c4e8; white-space: pre-wrap; user-select: text; }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--fg); border-radius: 12px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.primary { background: linear-gradient(135deg, #7c3aed, #6366f1); border-color: transparent; }
  body.failed .status, body.failed .bar { display: none; }
  body.failed .error { display: block; }
  .version { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: rgba(154,151,192,.6); font-size: 12px; }
</style>
</head>
<body>
  <div class="titlebar hidden" id="titlebar">
    <div class="drag" data-tauri-drag-region></div>
    <button aria-label="Minimize" id="min"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button aria-label="Close" class="close" id="close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.2"/></svg></button>
  </div>
  <main data-tauri-drag-region>
    <div class="center">
      <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" >
  <defs>
    <linearGradient id="og-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2a1d6b"/>
      <stop offset="0.5" stop-color="#140f38"/>
      <stop offset="1" stop-color="#070914"/>
    </linearGradient>
    <linearGradient id="og-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-core" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#ddd6fe"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="0.85" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#2e1065"/>
    </radialGradient>
    <linearGradient id="og-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="og-sat" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#db2777"/>
    </radialGradient>
    <radialGradient id="og-satglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="228" fill="url(#og-bg)"/>
  <rect x="24" y="24" width="976" height="976" rx="228" fill="url(#og-sheen)"/>
  <rect x="26" y="26" width="972" height="972" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>
  <circle cx="512" cy="512" r="360" fill="url(#og-glow)"/>
  <g transform="rotate(-24 512 512)">
    <ellipse cx="512" cy="512" rx="370" ry="124" fill="none" stroke="url(#og-ring)" stroke-width="34" opacity="0.4"/>
  </g>
  <circle cx="512" cy="512" r="196" fill="url(#og-core)"/>
  <g transform="rotate(-24 512 512)">
    <path d="M142 512 A370 124 0 0 0 882 512" fill="none" stroke="url(#og-ring)" stroke-width="34"/>
  </g>
  <circle cx="847" cy="409" r="92" fill="url(#og-satglow)"/>
  <circle cx="847" cy="409" r="44" fill="url(#og-sat)"/>
</svg></div>
      <h1>Open Gravity</h1>
      <p class="tag">One local endpoint for every AI model</p>
      <div class="status" id="status">Starting…</div>
      <div class="bar"><i></i></div>
      <div class="error" id="error">
        <h2>The router could not start</h2>
        <p id="errmsg"></p>
        <pre id="logs"></pre>
        <div class="row">
          <button class="btn primary" id="retry">Try again</button>
          <button class="btn" id="showlogs">Show logs</button>
          <button class="btn" id="quit">Quit</button>
        </div>
      </div>
    </div>
  </main>
  <div class="version" id="version"></div>
<script>
(function () {
  var T = window.__TAURI__;
  var invoke = T && T.core && T.core.invoke;
  var $ = function (id) { return document.getElementById(id); };
  if (!invoke) { $('status').textContent = 'Open Gravity desktop runtime not available.'; return; }
  var win = T.window && T.window.getCurrentWindow && T.window.getCurrentWindow();
  $('min').onclick = function () { win && win.minimize(); };
  $('close').onclick = function () { win && win.close(); };
  $('retry').onclick = function () { document.body.classList.remove('failed'); $('status').textContent = 'Starting…'; invoke('restart_core'); };
  $('quit').onclick = function () { invoke('quit_app'); };
  $('showlogs').onclick = function () {
    invoke('core_logs').then(function (l) { var p = $('logs'); p.textContent = l || '(no output)'; p.style.display = 'block'; p.scrollTop = p.scrollHeight; });
  };
  var shownPlatform = false;
  function tick() {
    invoke('desktop_info').then(function (i) {
      if (!shownPlatform) {
        shownPlatform = true;
        if (i.platform === 'windows') $('titlebar').classList.remove('hidden');
        $('version').textContent = 'v' + i.version;
      }
      if (i.phase === 'error') {
        document.body.classList.add('failed');
        $('errmsg').textContent = i.message;
      } else {
        document.body.classList.remove('failed');
        $('status').textContent = i.phase === 'ready' ? 'Opening the dashboard…' : i.message;
      }
    }).catch(function () {}).then(function () { setTimeout(tick, 350); });
  }
  tick();
})();
</script>
</body>
</html>
