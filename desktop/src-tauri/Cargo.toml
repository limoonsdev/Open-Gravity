[package]
name = "open-gravity-desktop"
version = "3.0.0"
description = "Open Gravity desktop app: the universal local AI router with its dashboard in a native window"
authors = ["Open Gravity contributors"]
license = "MIT"
repository = "https://github.com/limoonsdev/Open-Gravity"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "open-gravity-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
