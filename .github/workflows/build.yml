name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  executables:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: win-x64
            smoke: release/open-gravity-win-x64.exe
          - os: ubuntu-latest
            targets: linux-x64,linux-arm64
            smoke: release/open-gravity-linux-x64
          - os: macos-latest
            targets: macos-arm64,macos-x64
            smoke: release/open-gravity-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build single executable
        run: node scripts/build-exe.mjs --target ${{ matrix.targets }}
      - name: Smoke test
        run: node scripts/smoke.mjs ${{ matrix.smoke }}
      - uses: actions/upload-artifact@v4
        with:
          name: open-gravity-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: executables
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
